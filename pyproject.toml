[project]
name = "retropy"
version = "0.1.0"
description = "Game Boy, Game Boy Color, Game Boy Advance and NES emulator in pure Python, with a Flet desktop app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Abhishek Biswas", email = "abhishekbiswas772@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "av>=14",              # MP4 recording with sound (FFmpeg bundled)
    "flet[all]",
    "pillow>=11",          # GIFs, video frames (src/bridge/recorder)
]

# Run it as `python main.py`, `uv run retropy`, `python -m src`, or `retropy` after
# `pip install .` / `uv tool install .` (same CLI: no arguments opens the desktop app).
[project.scripts]
retropy = "main:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src", "main.py"]
exclude = ["src/rom", "src/core/ps1/native"]
dev-mode-dirs = ["."]

# pygame has no Android wheel. Desktop builds opt in below; `uv sync` still
# installs it through the dev group so tests and `python main.py` keep sound.
[dependency-groups]
dev = ["pytest", "pygame>=2.6.1"]

[tool.flet]
org = "com.abhishekbiswas"
product = "RetroPy"
artifact = "RetroPy"
company = "Abhishek Biswas"
copyright = "Copyright (C) 2026 Abhishek Biswas"
bundle_id = "com.abhishekbiswas.retropy"
icon_background = "#0F1115"
splash_color = "#0F1115"

[tool.flet.app]
module = "main.py"
exclude = ["tests", "rom", "src/rom", "docs", "packaging", "src/core/ps1/native/target"]

[tool.flet.windows]
dependencies = ["pygame>=2.6.1"]

[tool.flet.macos]
dependencies = ["pygame>=2.6.1"]

[tool.flet.linux]
bundle_id = "com.abhishekbiswas.retropy"
dependencies = ["pygame>=2.6.1"]

[tool.flet.android]
target_arch = ["arm64-v8a", "armeabi-v7a", "x86_64"]
split_per_abi = true

[tool.uv]
package = true           # installs the `retropy` command; `python main.py` works as before

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: ROM integration tests (Blargg, acid2, commercial ROMs), run with --slow"]
