# Desktop releases: a Windows installer (.exe) + portable zip, and a Linux .deb + tar.gz.
# Bundle id: com.abhishekbiswas.retropy
#
# Push a tag such as v0.2.0 to test, build, check and publish a GitHub Release.
# workflow_dispatch runs the same build and checks without publishing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  FLET_CLI_LOG_FORMAT: github

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      PYTHONUNBUFFERED: "1"
      PS1_CORE_REQUIRED: "1"
      GBA_CORE_REQUIRED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the PS1 core
        run: uv run python -m src.core.ps1.build

      - name: Build the GBA core
        run: uv run python -m src.core.gba.build

      - name: Unit tests and ROM tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb pulseaudio
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          export SDL_VIDEODRIVER=x11
          export SDL_AUDIODRIVER=pulse
          xvfb-run -a -s "-screen 0 1280x720x24" uv run python -m pytest -q -m "not slow"
          xvfb-run -a -s "-screen 0 1280x720x24" uv run python -m pytest -q --slow -m slow

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-latest
          - target: linux
            runner: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            echo "flet=${v%%-*}" >> "$GITHUB_OUTPUT"      # flet wants x.y.z
          else
            v="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=${v}" >> "$GITHUB_OUTPUT"
          echo "Version: ${v}"

      # the PS1 and GBA cores are native extensions: build them so `flet build` bundles them
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the PS1 and GBA cores
        shell: bash
        run: |
          uv sync --frozen
          uv run python -m src.core.ps1.build
          uv run python -m src.core.gba.build

      - name: Build app
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}
          build-version: ${{ steps.version.outputs.flet }}

      - name: Show the build
        shell: bash
        run: |
          out="${{ steps.build.outputs.output-path }}"
          echo "output: $out"
          find "$out" -maxdepth 2 | head -n 60
          if command -v python3 >/dev/null 2>&1; then py=python3; else py=python; fi
          "$py" packaging/check_bundle.py "$out"

      # ------------------------------------------------------------------ Windows
      - name: Windows installer (Inno Setup)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y | Out-Null
          $out = "${{ steps.build.outputs.output-path }}"
          $exe = (Get-ChildItem -Path $out -Filter *.exe -File | Select-Object -First 1).Name
          Write-Host "app exe: $exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=$out" `
            "/DOutputDir=$PWD\dist" "/DAppExe=$exe" packaging\windows\retropy.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Copy-Item "${{ steps.build.outputs.archive-path }}" "dist\RetroPy-${{ steps.version.outputs.value }}-windows-x64-portable.zip"
          Get-ChildItem dist

      - name: Check the Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem dist -Filter *-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "RetroPyInstall"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Get-ChildItem -Path $dir -Filter *.exe -File | Where-Object { $_.Name -notlike "unins*" } | Select-Object -First 1
          if (-not $exe) { throw "no app exe after install" }
          Write-Host "installed: $($exe.FullName)"
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "the app exited right away (code $($app.ExitCode))" }
          Write-Host "app still running after 20 s: OK"
          Stop-Process -Id $app.Id -Force
          $u = Get-ChildItem -Path $dir -Filter unins*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $u.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
          Write-Host "uninstall: OK"

      # ------------------------------------------------------------------ Linux
      - name: Linux .deb
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/linux/build-deb.sh "${{ steps.build.outputs.output-path }}" "${{ steps.version.outputs.value }}" dist
          cp "${{ steps.build.outputs.archive-path }}" "dist/RetroPy-${{ steps.version.outputs.value }}-linux-x64.tar.gz"
          ls -la dist

      - name: Check the .deb
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb | head -n 1)"
          dpkg-deb --info "$deb"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "./$deb" xvfb
          test -x "$(readlink -f /usr/bin/retropy)"
          desktop-file-validate /usr/share/applications/retropy.desktop 2>/dev/null || true
          set +e
          xvfb-run -a timeout 20 retropy
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::the app exited after start (code $code)"
            exit 1
          fi
          echo "app still running after 20 s: OK"
          sudo apt-get remove -y retropy

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(dist/**/*.exe dist/**/*.deb dist/**/*.zip dist/**/*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No packages to publish."
            exit 1
          fi
          (cd dist && sha256sum **/*.exe **/*.deb **/*.zip **/*.tar.gz | sed 's#  .*/#  #' > SHA256SUMS.txt)
          files+=(dist/SHA256SUMS.txt)
          notes="$(cat <<'EOF'
          ## Downloads

          | | |
          |---|---|
          | **Windows** installer | `RetroPy-…-windows-x64-setup.exe` |
          | **Windows** portable | `RetroPy-…-windows-x64-portable.zip` |
          | **Debian / Ubuntu** | `retropy_…_amd64.deb`, install with `sudo apt install ./retropy_…_amd64.deb` |
          | **Linux** portable | `RetroPy-…-linux-x64.tar.gz` |

          The PlayStation core is experimental. No BIOS or games are included.
          Checksums are in `SHA256SUMS.txt`.
          EOF
          )"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --title "RetroPy ${GITHUB_REF_NAME}" \
              --notes "${notes}"
          fi
