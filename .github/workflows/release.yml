# Desktop builds: Windows and Linux only.
# Bundle id: com.abhishekbiswas.gameboy_python
#
# Push a tag such as v0.1.0 to build and publish a GitHub Release.
# workflow_dispatch builds the same artifacts without publishing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  FLET_CLI_LOG_FORMAT: github

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Unit tests and ROM tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb pulseaudio
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          export SDL_VIDEODRIVER=x11
          export SDL_AUDIODRIVER=pulse
          xvfb-run -a -s "-screen 0 1280x720x24" uv run python -m pytest -q -m "not slow"
          xvfb-run -a -s "-screen 0 1280x720x24" uv run python -m pytest -q --slow -m slow

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-latest
          - target: linux
            runner: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}
          build-version: ${{ steps.version.outputs.value }}

      - name: Upload build archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
          archive: false

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build archives
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(dist/**/*.*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No build archives to publish."
            exit 1
          fi
          notes="$(cat <<'EOF'
          Desktop builds for Windows and Linux.

          Bundle id: `com.abhishekbiswas.gameboy_python`.
          EOF
          )"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "${notes}"
          fi
